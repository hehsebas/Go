{{define "base"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>{{template "title" .}}</title>
    <link rel="stylesheet" href="/static/css/tailwind.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-gray-50">
    <header class="bg-gradient-to-r from-blue-600 to-purple-600 shadow-lg">
        <div class="container mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <div class="logo">
                    <h1 class="text-3xl font-bold text-white">WebAppGo</h1>
                </div>
                <nav class="flex space-x-6">
                    <a class="text-white hover:text-blue-200 transition duration-300 font-medium" href="/">Home</a>
                    <a class="text-white hover:text-blue-200 transition duration-300 font-medium" href="/new-game">New Game</a>
                    <a class="text-white hover:text-blue-200 transition duration-300 font-medium" href="/about">About</a>
                    <a class="text-white hover:text-blue-200 transition duration-300 font-medium" href="/game">Game</a>
                </nav>
            </div>
        </div>
    </header>
    {{template "content" .}}
    <footer class="bg-blue-500 text-center py-4">
        <p> Created by <a href="https://github.com/hehsebas" class="text-white">Sebastián Reina &copy; 2025</a></p>
    </footer>
    <script src="/static/js/main.js"></script>
</body>
</html>
{{end}}
