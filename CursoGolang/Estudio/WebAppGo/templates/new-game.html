{{template "base" .}}

{{define "title"}}New Game{{end}}

{{define "content"}}
<section class="w-full py-5">
    <div class="flex flex-col justify-center text-center">
        <h2 class="py-4 text-center text-lg">Type your name to start the game</h2>
        <form action="/new-game" method="post">
            <div class="mb-4 flex justify-center text-center">
                <input type="text" placeholder="Your name" name="name" id="name" class="p-2 border border-gray-300 rounded-md">
            </div>
            <div class="flex justify-center text-center gap-2">
                <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition duration-300">Start game</button>
            </div>
        </form>
    </div>
</section>
{{end}}
